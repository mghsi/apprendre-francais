services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: apprendre_francais
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apprendre_francais"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - apprendre-francais-postgres:/var/lib/postgresql/data

volumes:
  apprendre-francais-postgres:
